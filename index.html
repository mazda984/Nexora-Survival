<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blok Savunma Oyunu</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
#canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
#canvas.locked { cursor: none; }
#ui {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
#hud {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 24px; align-items: center;
}
.hud-box {
  background: rgba(0,0,0,0.7); border: 2px solid #555; border-radius: 4px;
  padding: 8px 16px; color: #fff; font-size: 16px; font-weight: bold;
  text-shadow: 1px 1px 2px #000;
}
.hud-box span { color: #ffd700; }
#timer-box { border-color: #ff6600; }
#timer-box span { color: #ff6600; }
#health-box { position: absolute; bottom: 80px; left: 16px; }
#health-bar-bg {
  width: 200px; height: 20px; background: #333; border: 2px solid #555; border-radius: 3px;
}
#health-bar { height: 100%; background: #22cc22; border-radius: 2px; transition: width 0.3s; }
#crosshair {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #fff; font-size: 24px; text-shadow: 1px 1px 2px #000; pointer-events: none;
}
#hotbar {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 4px;
}
.hotbar-slot {
  width: 52px; height: 52px; background: rgba(0,0,0,0.7);
  border: 2px solid #888; border-radius: 4px; display: flex; align-items: center;
  justify-content: center; color: #fff; font-size: 12px; text-align: center;
}
.hotbar-slot.active { border-color: #fff; border-width: 3px; }
#block-count-display {
  position: absolute; bottom: 80px; right: 16px;
  background: rgba(0,0,0,0.7); border: 2px solid #555; border-radius: 4px;
  padding: 8px 16px; color: #fff; font-size: 16px; font-weight: bold;
  text-shadow: 1px 1px 2px #000;
}
#message-overlay {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85); border: 3px solid #ffd700; border-radius: 8px;
  padding: 32px 48px; text-align: center; color: #fff;
  display: none; pointer-events: all;
}
#message-overlay h2 { font-size: 32px; color: #ffd700; margin-bottom: 16px; }
#message-overlay p { font-size: 18px; margin-bottom: 24px; }
#message-overlay button {
  background: #ffd700; color: #000; border: none; border-radius: 4px;
  padding: 12px 32px; font-size: 18px; font-weight: bold; cursor: pointer;
}
#message-overlay button:hover { background: #ffaa00; }
#round-display {
  position: absolute; top: 16px; right: 16px;
  background: rgba(0,0,0,0.7); border: 2px solid #9b59b6; border-radius: 4px;
  padding: 8px 16px; color: #fff; font-size: 16px; font-weight: bold;
}
#enemy-count {
  position: absolute; top: 16px; left: 16px;
  background: rgba(0,0,0,0.7); border: 2px solid #e74c3c; border-radius: 4px;
  padding: 8px 16px; color: #fff; font-size: 16px; font-weight: bold;
}
#phase-display {
  position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); border: 2px solid #3498db; border-radius: 4px;
  padding: 6px 20px; color: #3498db; font-size: 14px; font-weight: bold;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-box" id="timer-box">⏱ <span id="timer">15</span>s</div>
    <div class="hud-box">Blok: <span id="block-count">30</span></div>
  </div>
  <div id="round-display">Tur: <span id="round-num">1</span></div>
  <div id="enemy-count">Düşman: <span id="enemy-num">0</span></div>
  <div id="phase-display" id="phase-text">⚒ İnşaat Aşaması</div>
  <div id="crosshair">+</div>
  <div id="lock-hint" style="display:none;position:absolute;bottom:50%;left:50%;transform:translate(-50%,50%);margin-top:40px;background:rgba(0,0,0,0.75);color:#ffd700;padding:8px 20px;border-radius:6px;font-size:15px;pointer-events:none;margin-top:48px;">🖱 Döndürmek için tıkla</div>
  <div id="zone-health-box" style="position:absolute;bottom:130px;left:16px;">
    <div style="color:#3399ff;font-size:14px;margin-bottom:4px">🔷 Savunma Alanı: <span id="zone-hp-num">100</span></div>
    <div style="width:200px;height:14px;background:#333;border:2px solid #555;border-radius:3px;">
      <div id="zone-health-bar" style="height:100%;background:#3399ff;border-radius:2px;transition:width 0.3s;width:100%"></div>
    </div>
  </div>
  <div id="health-box">
    <div style="color:#fff;font-size:14px;margin-bottom:4px">❤ Sağlık</div>
    <div id="health-bar-bg"><div id="health-bar" style="width:100%"></div></div>
  </div>
  <div id="block-count-display">🧱 <span id="block-count2">30</span></div>
  <div id="sprint-indicator" style="position:absolute;bottom:80px;right:16px;margin-top:36px;background:rgba(0,0,0,0.7);border:2px solid #555;border-radius:4px;padding:4px 12px;color:#aaa;font-size:13px;margin-top:44px;">F: Koşma <span id="sprint-status">OFF</span></div>
  <div id="message-overlay">
    <h2 id="msg-title">Hazır mısın?</h2>
    <p id="msg-text">1 dakika içinde yapını inşa et!</p>
    <button id="msg-btn" onclick="startGame()">Başla</button>
  </div>
</div>

let scene, camera, renderer, raycaster;
let blocks = [], enemies = [], projectiles = [], particles = [];
let defenseZone = null, defenseZoneHealth = 100;
let playerHealth = 100, blockCount = 30, round = 1;
let gamePhase = 'menu'; // menu, build, combat, roundEnd, gameOver
let buildTimer = 15, combatTimer = 0;
let enemiesThisRound = 5;
let clock;
let moveState = { forward: false, back: false, left: false, right: false };
let isSprinting = false, isJumping = false, velocityY = 0, onGround = true;
const GRAVITY = -18, JUMP_FORCE = 7, PLAYER_SPEED = 5, SPRINT_MULT = 1.8;
function lockPointer() { const c = document.getElementById('canvas'); const p = c.requestPointerLock || c.mozRequestPointerLock || c.webkitRequestPointerLock; if (p) p.call(c); }
let isPointerLocked = false;
let yaw = 0, pitch = 0;
let ghostBlock = null;
let woodTexture, grassTexture;

const GRID_SIZE = 20;
const BLOCK_SIZE = 1;
const PLAYER_HEIGHT = 1.7;
const ENEMY_COUNT_START = 5;
const ENEMY_COUNT_INCREASE = 5;
const BLOCKS_PER_ROUND = 15;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, PLAYER_HEIGHT, 0);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  raycaster = new THREE.Raycaster(new THREE.Vector3(), new THREE.Vector3(), 0, 5);
  clock = new THREE.Clock();

  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(10, 20, 10);
  sun.castShadow = true;
  scene.add(sun);

  loadTextures();
  buildGround();
  setupControls();

  window.addEventListener('resize', onResize);
  document.getElementById('message-overlay').style.display = 'block';

  animate();
}

function loadTextures() {
  const woodImg = new Image();
  woodImg.src = 'data:image/webp;base64,' + WOOD_B64;
  woodTexture = new THREE.Texture(woodImg);
  woodImg.onload = () => { woodTexture.needsUpdate = true; };

  const grassImg = new Image();
  grassImg.src = 'data:image/png;base64,' + GRASS_B64;
  grassTexture = new THREE.Texture(grassImg);
  grassImg.onload = () => { grassTexture.needsUpdate = true; };
}

function buildGround() {
  const geo = new THREE.PlaneGeometry(GRID_SIZE * 2, GRID_SIZE * 2);
  const mat = new THREE.MeshLambertMaterial({ map: grassTexture });
  const ground = new THREE.Mesh(geo, mat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  ground.userData.isGround = true;
  scene.add(ground);

  const gridHelper = new THREE.GridHelper(GRID_SIZE * 2, GRID_SIZE * 2, 0x333333, 0x333333);
  gridHelper.position.y = 0.01;
  gridHelper.material.opacity = 0.2;
  gridHelper.material.transparent = true;
  scene.add(gridHelper);

  createDefenseZone();
}

function createDefenseZone() {
  // Glowing platform at center
  const baseGeo = new THREE.CylinderGeometry(2.5, 2.5, 0.2, 32);
  const baseMat = new THREE.MeshLambertMaterial({ color: 0x3399ff, transparent: true, opacity: 0.85 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.set(0, 0.1, 0);
  scene.add(base);

  // Crystal above it
  const crystalGeo = new THREE.OctahedronGeometry(0.8, 0);
  const crystalMat = new THREE.MeshLambertMaterial({ color: 0x66ddff, transparent: true, opacity: 0.9 });
  const crystal = new THREE.Mesh(crystalGeo, crystalMat);
  crystal.position.set(0, 1.4, 0);
  scene.add(crystal);

  // Ring around base
  const ringGeo = new THREE.TorusGeometry(2.5, 0.08, 8, 48);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x00aaff });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.set(0, 0.21, 0);
  scene.add(ring);

  defenseZone = { base, crystal, ring, health: 100 };
}

function createBlock(x, y, z, health = 100) {
  const geo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
  const mat = new THREE.MeshLambertMaterial({ map: woodTexture });
  const block = new THREE.Mesh(geo, mat);
  block.position.set(x, y + 0.5, z);
  block.castShadow = true;
  block.receiveShadow = true;
  block.userData.isBlock = true;
  block.userData.health = health;
  block.userData.maxHealth = health;
  scene.add(block);
  blocks.push(block);
  return block;
}

function getBlockOpacity(block) {
  return block.userData.health / block.userData.maxHealth;
}

function damageBlock(block, dmg) {
  block.userData.health = Math.max(0, block.userData.health - dmg);
  const ratio = block.userData.health / block.userData.maxHealth;
  block.material.opacity = 0.3 + ratio * 0.7;
  block.material.transparent = true;
  if (block.userData.health <= 0) {
    scene.remove(block);
    blocks.splice(blocks.indexOf(block), 1);
  }
}

function setupControls() {
  document.addEventListener('keydown', (e) => {
    if (gamePhase === 'build' || gamePhase === 'combat') {
      if (e.code === 'KeyW') moveState.forward = true;
      if (e.code === 'KeyS') moveState.back = true;
      if (e.code === 'KeyA') moveState.left = true;
      if (e.code === 'KeyD') moveState.right = true;
    }
    if (e.code === 'KeyE' && gamePhase === 'build') placeBlock();
    if (e.code === 'KeyQ' && gamePhase === 'build') removeBlock();
    if (e.code === 'KeyF') { isSprinting = !isSprinting; }
    if (e.code === 'Space' && onGround && (gamePhase === 'build' || gamePhase === 'combat')) {
      velocityY = JUMP_FORCE; onGround = false; e.preventDefault();
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'KeyW') moveState.forward = false;
    if (e.code === 'KeyS') moveState.back = false;
    if (e.code === 'KeyA') moveState.left = false;
    if (e.code === 'KeyD') moveState.right = false;
  });

  const canvas = document.getElementById('canvas');

  function lockPointer() {
    const p = canvas.requestPointerLock || canvas.mozRequestPointerLock || canvas.webkitRequestPointerLock;
    if (p) p.call(canvas);
  }

  canvas.addEventListener('click', () => {
    if (gamePhase === 'build' || gamePhase === 'combat') lockPointer();
  });

  const onPLC = () => {
    isPointerLocked = !!(document.pointerLockElement === canvas ||
      document.mozPointerLockElement === canvas ||
      document.webkitPointerLockElement === canvas);
    if (isPointerLocked) {
      canvas.classList.add('locked');
      document.getElementById('lock-hint').style.display = 'none';
    } else {
      canvas.classList.remove('locked');
      if (gamePhase === 'build' || gamePhase === 'combat')
        document.getElementById('lock-hint').style.display = 'block';
    }
  };
  document.addEventListener('pointerlockchange', onPLC);
  document.addEventListener('mozpointerlockchange', onPLC);
  document.addEventListener('webkitpointerlockchange', onPLC);

  document.addEventListener('mousemove', (e) => {
    if (gamePhase !== 'build' && gamePhase !== 'combat') return;
    if (!isPointerLocked) return;
    const mx = e.movementX || e.mozMovementX || e.webkitMovementX || 0;
    const my = e.movementY || e.mozMovementY || e.webkitMovementY || 0;
    yaw -= mx * 0.003;
    pitch -= my * 0.003;
    pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
  });

  document.addEventListener('mousedown', (e) => {
    if (!isPointerLocked && (gamePhase === 'build' || gamePhase === 'combat')) {
      lockPointer();
      return;
    }
    if (e.button === 0 && gamePhase === 'build') placeBlock();
    if (e.button === 2 && gamePhase === 'build') removeBlock();
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('pointerlockerror', () => console.warn('Pointer lock failed'));
  document.addEventListener('mozpointerlockerror', () => console.warn('Pointer lock failed'));
}

function getPlacementTarget() {
  raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  const targets = [...blocks.map(b => b), ...scene.children.filter(c => c.userData.isGround)];
  const hits = raycaster.intersectObjects(targets);
  return hits.length > 0 ? hits[0] : null;
}

function placeBlock() {
  if (blockCount <= 0) return;
  const hit = getPlacementTarget();
  if (!hit) return;
  const normal = hit.face.normal.clone();
  let pos = hit.object.position.clone().add(normal);
  if (hit.object.userData.isGround) {
    pos = new THREE.Vector3(
      Math.round(hit.point.x),
      0,
      Math.round(hit.point.z)
    );
  } else {
    pos = new THREE.Vector3(
      Math.round(hit.object.position.x + normal.x),
      Math.round(hit.object.position.y + normal.y - 0.5),
      Math.round(hit.object.position.z + normal.z)
    );
  }
  // Don't place on player
  const playerPos = camera.position;
  if (Math.abs(pos.x - playerPos.x) < 1 && Math.abs(pos.z - playerPos.z) < 1) return;

  createBlock(pos.x, pos.y, pos.z);
  blockCount--;
  updateHUD();
}

function removeBlock() {
  raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  const hits = raycaster.intersectObjects(blocks);
  if (hits.length > 0) {
    const block = hits[0].object;
    scene.remove(block);
    blocks.splice(blocks.indexOf(block), 1);
    blockCount++;
    updateHUD();
  }
}

function spawnEnemies(count) {
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
    const dist = 15 + Math.random() * 5;
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;

    const geo = new THREE.BoxGeometry(0.8, 1.6, 0.8);
    const mat = new THREE.MeshLambertMaterial({ color: 0x2d8a2d });
    const enemy = new THREE.Mesh(geo, mat);
    enemy.position.set(x, 0.8, z);
    enemy.castShadow = true;

    // Eyes
    const eyeGeo = new THREE.BoxGeometry(0.15, 0.15, 0.1);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.2, 0.3, 0.41);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.2, 0.3, 0.41);
    enemy.add(eyeL, eyeR);

    enemy.userData.isEnemy = true;
    enemy.userData.health = 30 + round * 5;
    enemy.userData.speed = 2 + round * 0.3;
    enemy.userData.explodeRadius = 2;
    enemy.userData.explodeDamage = 25;
    enemy.userData.blockDamage = 40;

    scene.add(enemy);
    enemies.push(enemy);
  }
  updateHUD();
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    const toPlayer = new THREE.Vector3().subVectors(camera.position, enemy.position);
    toPlayer.y = 0;
    const distToPlayer = toPlayer.length();

    // Check if near a block
    let nearBlock = null;
    let nearBlockDist = 1.2;
    for (const block of blocks) {
      const d = enemy.position.distanceTo(block.position);
      if (d < nearBlockDist) {
        nearBlock = block;
        nearBlockDist = d;
        break;
      }
    }

    if (nearBlock) {
      // Explode on block
      explodeEnemy(enemy, true, nearBlock);
      enemies.splice(i, 1);
      continue;
    }

    if (distToPlayer < 1.5) {
      // Explode on player
      explodeEnemy(enemy, false, null);
      enemies.splice(i, 1);
      playerHealth -= enemy.userData.explodeDamage;
      if (playerHealth <= 0) { playerHealth = 0; gameOver(); }
      updateHUD();
      continue;
    }

    // Move toward defense zone (center) primarily, player secondarily
    const toZone = new THREE.Vector3(0, 0, 0).sub(enemy.position);
    toZone.y = 0;
    const distToZone = toZone.length();

    // Check if reached defense zone
    if (distToZone < 2.0 && !nearBlock) {
      // Explode on defense zone
      spawnParticles(enemy.position.clone(), 24, 0xff6600, 0xffdd00);
      scene.remove(enemy);
      enemies.splice(i, 1);
      defenseZone.health = Math.max(0, defenseZone.health - enemy.userData.explodeDamage);
      updateDefenseZone();
      if (defenseZone.health <= 0) { gameOver(); }
      updateHUD();
      continue;
    }

    // Move toward zone
    const moveDir = toZone.normalize();
    enemy.position.addScaledVector(moveDir, enemy.userData.speed * dt);
    enemy.lookAt(0, enemy.position.y, 0);
  }

  if (gamePhase === 'combat' && enemies.length === 0) {
    roundWon();
  }
  updateHUD();
}

function spawnParticles(pos, count, color1, color2) {
  for (let i = 0; i < count; i++) {
    const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
    const col = Math.random() > 0.5 ? color1 : color2;
    const mat = new THREE.MeshBasicMaterial({ color: col });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 8,
      Math.random() * 6 + 2,
      (Math.random() - 0.5) * 8
    );
    p.userData.vel = vel;
    p.userData.life = 0.8 + Math.random() * 0.4;
    p.userData.age = 0;
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.age += dt;
    if (p.userData.age >= p.userData.life) {
      scene.remove(p);
      particles.splice(i, 1);
      continue;
    }
    p.userData.vel.y -= 12 * dt;
    p.position.addScaledVector(p.userData.vel, dt);
    const ratio = 1 - p.userData.age / p.userData.life;
    p.material.opacity = ratio;
    p.material.transparent = true;
    p.rotation.x += dt * 5;
    p.rotation.z += dt * 3;
  }
}

function explodeEnemy(enemy, hitBlock, block) {
  const pos = enemy.position.clone();
  spawnParticles(pos, 28, 0xff6600, 0xffdd00);

  if (hitBlock && block) {
    damageBlock(block, enemy.userData.blockDamage);
    for (const b of blocks) {
      if (b !== block && b.position.distanceTo(pos) < enemy.userData.explodeRadius) {
        damageBlock(b, enemy.userData.blockDamage * 0.5);
      }
    }
  }
  scene.remove(enemy);
}

function playerAABB(pos) {
  return { minX: pos.x - 0.3, maxX: pos.x + 0.3, minY: pos.y - PLAYER_HEIGHT, maxY: pos.y + 0.1, minZ: pos.z - 0.3, maxZ: pos.z + 0.3 };
}
function blockAABB(b) {
  return { minX: b.position.x - 0.5, maxX: b.position.x + 0.5, minY: b.position.y - 0.5, maxY: b.position.y + 0.5, minZ: b.position.z - 0.5, maxZ: b.position.z + 0.5 };
}
function aabbOverlap(a, b) {
  return a.maxX > b.minX && a.minX < b.maxX && a.maxY > b.minY && a.minY < b.maxY && a.maxZ > b.minZ && a.minZ < b.maxZ;
}

function movePlayer(dt) {
  const speed = PLAYER_SPEED * (isSprinting ? SPRINT_MULT : 1);
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const dir = new THREE.Vector3();

  if (moveState.forward) dir.add(forward);
  if (moveState.back) dir.sub(forward);
  if (moveState.left) dir.sub(right);
  if (moveState.right) dir.add(right);
  if (dir.length() > 0) dir.normalize();

  // Gravity
  velocityY += GRAVITY * dt;
  let newPos = camera.position.clone();

  // Move X
  newPos.x += dir.x * speed * dt;
  newPos.x = Math.max(-GRID_SIZE + 1, Math.min(GRID_SIZE - 1, newPos.x));
  let aabb = playerAABB(newPos);
  for (const b of blocks) {
    if (aabbOverlap(aabb, blockAABB(b))) {
      newPos.x = camera.position.x;
      break;
    }
  }

  // Move Z
  newPos.z += dir.z * speed * dt;
  newPos.z = Math.max(-GRID_SIZE + 1, Math.min(GRID_SIZE - 1, newPos.z));
  aabb = playerAABB(newPos);
  for (const b of blocks) {
    if (aabbOverlap(aabb, blockAABB(b))) {
      newPos.z = camera.position.z;
      break;
    }
  }

  // Move Y (gravity + jump)
  newPos.y += velocityY * dt;
  aabb = playerAABB(newPos);
  onGround = false;
  // Ground check
  if (newPos.y - PLAYER_HEIGHT <= 0) {
    newPos.y = PLAYER_HEIGHT;
    velocityY = 0;
    onGround = true;
  }
  // Block vertical collision
  for (const b of blocks) {
    const ba = blockAABB(b);
    if (aabbOverlap(playerAABB(newPos), ba)) {
      if (velocityY < 0) {
        // Landing on top of block
        newPos.y = ba.maxY + PLAYER_HEIGHT;
        velocityY = 0;
        onGround = true;
      } else if (velocityY > 0) {
        // Hitting block from below
        newPos.y = ba.minY - 0.1;
        velocityY = 0;
      }
    }
  }

  camera.position.copy(newPos);
  const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);
}

function updateGhostBlock() {
  if (ghostBlock) { scene.remove(ghostBlock); ghostBlock = null; }
  if (gamePhase !== 'build') return;

  const hit = getPlacementTarget();
  if (!hit) return;

  let pos;
  if (hit.object.userData.isGround) {
    pos = new THREE.Vector3(Math.round(hit.point.x), 0.5, Math.round(hit.point.z));
  } else {
    const normal = hit.face.normal;
    pos = new THREE.Vector3(
      Math.round(hit.object.position.x + normal.x),
      Math.round(hit.object.position.y + normal.y),
      Math.round(hit.object.position.z + normal.z)
    );
  }

  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, wireframe: false });
  ghostBlock = new THREE.Mesh(geo, mat);
  ghostBlock.position.copy(pos);
  scene.add(ghostBlock);
}

function updateHUD() {
  document.getElementById('timer').textContent = Math.ceil(buildTimer);
  document.getElementById('block-count').textContent = blockCount;
  document.getElementById('block-count2').textContent = blockCount;
  document.getElementById('round-num').textContent = round;
  document.getElementById('enemy-num').textContent = enemies.length;
  const hpPct = (playerHealth / 100) * 100;
  document.getElementById('health-bar').style.width = hpPct + '%';
  document.getElementById('sprint-status').textContent = isSprinting ? 'ON ⚡' : 'OFF';
  document.getElementById('sprint-status').style.color = isSprinting ? '#ffd700' : '#aaa';
  document.getElementById('health-bar').style.background =
    hpPct > 50 ? '#22cc22' : hpPct > 25 ? '#ffaa00' : '#cc2222';
}

function startGame() {
  document.getElementById('message-overlay').style.display = 'none';
  gamePhase = 'build';
  buildTimer = 15;
  document.getElementById('phase-display').textContent = '⚒ İnşaat Aşaması - E ile Blok Koy, Sağ Tık ile Sil';
  document.getElementById('lock-hint').style.display = 'block';
  lockPointer();
  updateHUD();
}

function startCombat() {
  gamePhase = 'combat';
  document.getElementById('phase-display').textContent = '⚔ Savaş Aşaması! Düşmanlar Geliyor!';
  document.getElementById('timer-box').style.display = 'none';
  enemiesThisRound = ENEMY_COUNT_START + (round - 1) * ENEMY_COUNT_INCREASE;
  spawnEnemies(enemiesThisRound);
}

function roundWon() {
  gamePhase = 'roundEnd';
  document.exitPointerLock();
  blockCount += BLOCKS_PER_ROUND;
  round++;
  const nextEnemies = ENEMY_COUNT_START + (round - 1) * ENEMY_COUNT_INCREASE;
  showMessage(
    '🏆 Tur Kazanıldı!',
    `+${BLOCKS_PER_ROUND} blok kazandın! Toplam: ${blockCount}\nSonraki turda ${nextEnemies} düşman gelecek.`,
    'Sonraki Tur',
    nextRound
  );
}

function nextRound() {
  document.getElementById('message-overlay').style.display = 'none';
  gamePhase = 'build';
  defenseZone.health = Math.min(100, defenseZone.health + 20); updateDefenseZone();
  buildTimer = 15;
  document.getElementById('timer-box').style.display = 'flex';
  document.getElementById('phase-display').textContent = '⚒ İnşaat Aşaması - E ile Blok Koy, Sağ Tık ile Sil';
  lockPointer();
  updateHUD();
}

function gameOver() {
  gamePhase = 'gameOver';
  document.exitPointerLock();
  showMessage('💀 Oyun Bitti!', `${round - 1}. tura kadar dayandın!`, 'Yeniden Başla', resetGame);
}

function resetGame() {
  blocks.forEach(b => scene.remove(b));
  enemies.forEach(e => scene.remove(e));
  particles.forEach(p => scene.remove(p));
  blocks = []; enemies = []; particles = [];
  blockCount = 30; round = 1; playerHealth = 100;
  defenseZone.health = 100; updateDefenseZone();
  buildTimer = 15;
  camera.position.set(0, PLAYER_HEIGHT, 0);
  yaw = 0; pitch = 0;
  gamePhase = 'build';
  document.getElementById('message-overlay').style.display = 'none';
  document.getElementById('timer-box').style.display = 'flex';
  document.getElementById('phase-display').textContent = '⚒ İnşaat Aşaması - E ile Blok Koy, Sağ Tık ile Sil';
  lockPointer();
  updateHUD();
}

function showMessage(title, text, btnText, callback) {
  document.getElementById('msg-title').textContent = title;
  document.getElementById('msg-text').textContent = text;
  document.getElementById('msg-btn').textContent = btnText;
  document.getElementById('msg-btn').onclick = callback;
  document.getElementById('message-overlay').style.display = 'block';
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function updateDefenseZone() {
  if (!defenseZone) return;
  const ratio = defenseZone.health / 100;
  defenseZone.crystal.material.color.setRGB(ratio * 0.4 + 0.6 * (1-ratio), ratio * 0.87, 1.0);
  defenseZone.base.material.opacity = 0.4 + ratio * 0.5;
  defenseZone.base.material.color.setRGB(ratio * 0.2, ratio * 0.6 + 0.1, 1.0);
  // Update defense zone health in HUD
  const pct = defenseZone.health;
  document.getElementById('zone-health-bar').style.width = pct + '%';
  document.getElementById('zone-health-bar').style.background = pct > 50 ? '#3399ff' : pct > 25 ? '#ff9900' : '#ff3333';
  document.getElementById('zone-hp-num').textContent = Math.round(pct);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (defenseZone) {
    defenseZone.crystal.rotation.y += dt * 1.2;
    defenseZone.crystal.position.y = 1.4 + Math.sin(Date.now() * 0.002) * 0.15;
  }

  updateParticles(dt);

  if (gamePhase === 'build') {
    buildTimer -= dt;
    if (buildTimer <= 0) {
      buildTimer = 0;
      startCombat();
    }
    movePlayer(dt);
    updateGhostBlock();
    updateHUD();
  } else if (gamePhase === 'combat') {
    movePlayer(dt);
    updateEnemies(dt);
  }

  renderer.render(scene, camera);
}

init();
</script>
</body>
